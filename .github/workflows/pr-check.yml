name: PR checks

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: HTML and internal links
        run: node scripts/check-html.mjs

      - name: Install Chrome
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: No horizontal overflow
        run: node scripts/check-overflow.mjs
