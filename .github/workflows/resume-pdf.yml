name: Resume PDFs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: Render résumé PDFs from the page
        run: node scripts/render-resume.mjs

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf resume-pt.pdf resume-es.pdf resume-it.pdf
          if git diff --staged --quiet; then
            echo "No PDF changes"
          else
            git commit -m "chore: update résumé PDFs [skip ci]"
            git push
          fi
